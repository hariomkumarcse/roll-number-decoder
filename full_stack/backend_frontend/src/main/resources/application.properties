# ---------------------------------------------------------
# Server
# ---------------------------------------------------------
server.port=8080

# ---------------------------------------------------------
# MySQL database connection
# createDatabaseIfNotExist=true means you do NOT need to manually
# run CREATE DATABASE first - it creates it on first connect.
# Update username/password below to match your local MySQL install.
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/rolldecoder?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=MySQL1234@@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------
# JPA / Hibernate
# "update" auto-creates/updates the roll_number_search_log table on startup.
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------
# Thymeleaf
# false = templates re-load on every request without restarting the app
# ---------------------------------------------------------
spring.thymeleaf.cache=false
