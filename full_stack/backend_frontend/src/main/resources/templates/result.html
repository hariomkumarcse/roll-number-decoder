<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decoded — Roll Number Decoder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page">

    <section class="hero">
        <h1 class="hero__title">Decoded Roll Number</h1>
    </section>

    <section class="sheet">

        <p class="decoded-roll" th:text="${decoded.rollNumber}">2402920100075</p>

        <table class="mark-table">
            <tbody>
            <tr>
                <th>Academic year</th>
                <td th:text="${decoded.fullYear}">2024</td>
            </tr>
            <tr>
                <th>College code</th>
                <td th:text="${decoded.collegeCode}">292</td>
            </tr>
            <tr>
                <th>College</th>
                <td th:text="${decoded.collegeName}">MIT Meerut</td>
            </tr>
            <tr>
                <th>Branch code</th>
                <td th:text="${decoded.branchCode}">10</td>
            </tr>
            <tr>
                <th>Branch</th>
                <td th:text="${decoded.branchName}">Computer Science &amp; Engineering (Core)</td>
            </tr>
            <tr>
                <th>Serial number</th>
                <td th:text="${decoded.serialNumber}">75</td>
            </tr>
            <tr>
                <th>Admission type</th>
                <td>
                    <span class="badge"
                          th:classappend="${decoded.admissionType == 'Regular'} ? 'badge--regular' : 'badge--lateral'"
                          th:text="${decoded.admissionType}">Regular</span>
                </td>
            </tr>
            </tbody>
        </table>

        <a class="back-link" th:href="@{/}">&larr; Decode another roll number</a>

    </section>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
